# swe-loop, Milestone 1. One fast check; the multi-check form is the target design.
[instrument]
paths = ["tests/"]

[checks.fast]
cmd = "uv run --extra tests python -m pytest -q --benchmark-disable --junitxml=.swe-loop/junit.xml"
report = "junit"
path = ".swe-loop/junit.xml"

[done]
fast_green = true

[budget]
max_cycles = 30
max_minutes = 90
episode_tokens = 8_000_000   # 1M was ~20 turns: cache reads dominate (M1 findings, 1.5)

[forge]
adapter = "gh"   # submit pushes and opens a draft PR as the machine account (swe-loop M2 §7)
required = ["test (3.14, ubuntu-latest)"]   # the one check the CI verdict judges (swe-loop M2 §7.7, decision 3)
